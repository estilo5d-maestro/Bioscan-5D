# ============================================================
# BIOSCAN 5D — netlify.toml  (versión COMPLETA · Sub-mensaje 2.4)
# Incluye las funciones del diagnóstico (2.3) + las del módulo PRO (2.4).
# Si tu archivo ya tenía las 3 primeras, basta con añadir los DOS
# últimos bloques (activar-codigo y progreso).
# ============================================================

[build]
  publish = "."
  functions = "netlify/functions"

# ---------- Diagnóstico (Sub-mensaje 2.3) ----------
[[redirects]]
  from = "/api/calcular-perfil"
  to = "/.netlify/functions/calcular-perfil"
  status = 200

[[redirects]]
  from = "/api/enviar-rdstation"
  to = "/.netlify/functions/enviar-rdstation"
  status = 200

[[redirects]]
  from = "/api/webhook-hotmart"
  to = "/.netlify/functions/webhook-hotmart"
  status = 200

# ---------- Módulo PRO (Sub-mensaje 2.4) — NUEVOS ----------
[[redirects]]
  from = "/api/activar-codigo"
  to = "/.netlify/functions/activar-codigo"
  status = 200

[[redirects]]
  from = "/api/progreso"
  to = "/.netlify/functions/progreso"
  status = 200

[[redirects]]
  from = "/api/recuperar-diagnostico"
  to = "/.netlify/functions/recuperar-diagnostico"
  status = 200

[[redirects]]
  from = "/api/obtener-codigo"
  to = "/.netlify/functions/obtener-codigo"
  status = 200

[[redirects]]
  from = "/api/estado-diagnostico"
  to = "/.netlify/functions/estado-diagnostico"
  status = 200    

[[redirects]]
  from = "/api/health-check"
  to = "/.netlify/functions/health-check"
  status = 200